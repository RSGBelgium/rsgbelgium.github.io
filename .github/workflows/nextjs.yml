# Deploys the website to GitHub Pages (https://rsg-belgium.org).
#
# On every push to main (and when started by hand), it:
# 1. runs CI (ci.yml): lint, formatting, types, tests, content check, build
#    and site check; nothing is deployed unless all of them pass;
# 2. packages the site that CI built and checked (the "site" artifact) for
#    Pages, without building it again;
# 3. deploys it to the github-pages environment.
#
# This is the only way the site is published: the old gh-pages branch is
# no longer used.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time: a newer run waits for the running one, which is
# never cancelled half-way. Runs queued in between are skipped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Package the site for Pages
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: read
    steps:
      - name: Download the site built and checked by CI
        uses: actions/download-artifact@v8
        with:
          name: site
          path: out

      - name: Check that Pages is set up to deploy from GitHub Actions
        uses: actions/configure-pages@v6

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
